# ── HTTP: redirect to HTTPS + certbot ACME challenge ─────────────────────────
server {
    listen 80;
    server_name agritwin.online www.agritwin.online;

    # Use Docker's internal DNS resolver; re-resolve upstream every 30 s so nginx
    # picks up the new container IP after a rebuild without requiring a manual reload.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Let certbot validate domain ownership via webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTP fallback: bare IP access (scanners, direct IP) ───────────────────────
# Returns 444 (silent drop) so bots get nothing useful.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name agritwin.online www.agritwin.online;

    ssl_certificate     /etc/letsencrypt/live/agritwin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agritwin.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $upstream http://agritwin-web-1:5000;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }
}
